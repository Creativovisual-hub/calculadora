# Dashboard del equipo DXD (sitio aparte de la oficina virtual).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors 'self' https://sites.google.com https://*.googleusercontent.com"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
